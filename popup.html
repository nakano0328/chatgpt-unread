<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>ChatGPT 未確認</h1>
      <button id="mark-all" type="button" hidden>すべて確認済み</button>
    </header>

    <section>
      <h2>未確認 <span id="unread-count" class="count"></span></h2>
      <ul id="unread"></ul>
      <p id="unread-empty" class="empty">未確認の回答はありません</p>
    </section>

    <section id="running-section" hidden>
      <h2>実行中</h2>
      <ul id="running"></ul>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
